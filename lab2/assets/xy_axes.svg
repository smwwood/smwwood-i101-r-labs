<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" fill="#fcfcfa"/><text x="500" y="50" text-anchor="middle" font-size="31" font-family="Arial" font-weight="700" fill="#1460f3">What do x and y mean on a graph?</text><text x="500" y="89" text-anchor="middle" font-size="21" font-family="Arial" fill="#354252">Example: imaginary summer movie box office totals</text><path d="M175 390H845M175 390V125" stroke="#283544" stroke-width="4"/><g fill="#3cc8e1"><rect x="235" y="235" width="120" height="155"/><rect x="445" y="175" width="120" height="215"/><rect x="655" y="280" width="120" height="110"/></g><g fill="#283544" font-size="20" font-family="Arial" text-anchor="middle"><text x="295" y="422">Movie A</text><text x="505" y="422">Movie B</text><text x="715" y="422">Movie C</text><text x="500" y="480" font-weight="700" fill="#1460f3">x = movie title (category)</text><text x="65" y="260" transform="rotate(-90 65 260)" font-weight="700" fill="#cf2f7b">y = box office sales</text></g><text x="500" y="520" text-anchor="middle" font-size="18" font-family="Arial" fill="#5c6470">Fictional example—not actual box office figures</text></svg>