<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Variables can store different kinds of values</title>
<desc id="desc">Four small examples show number, word, logical, and vector variables. A larger fifth example shows a data frame named scooterData holding an entire table.</desc>
<rect width="1200" height="760" fill="#fcfcfa"/>
<g font-family="Avenir, Aptos, Arial, sans-serif">
<text x="600" y="57" text-anchor="middle" font-size="39" font-weight="700" fill="#1460f3">A variable can hold a whole table too</text>
<text x="600" y="98" text-anchor="middle" font-size="23" fill="#354252">In R, a data frame is another kind of object stored in a variable.</text>
</g>
<!-- Four simple variable cards, generously spaced -->
<g stroke="#dce0e6" stroke-width="3" fill="white">
<rect x="40" y="135" width="265" height="155" rx="22"/>
<rect x="325" y="135" width="265" height="155" rx="22"/>
<rect x="610" y="135" width="265" height="155" rx="22"/>
<rect x="895" y="135" width="265" height="155" rx="22"/>
<rect x="40" y="325" width="1120" height="380" rx="25"/>
</g>
<g font-family="Avenir, Aptos, Arial, sans-serif" font-size="18" font-weight="700" fill="#283544">
<rect x="59" y="151" width="89" height="33" rx="16" fill="#ffd45a"/><text x="103" y="174" text-anchor="middle">number</text>
<rect x="344" y="151" width="70" height="33" rx="16" fill="#cf2f7b"/><text x="379" y="174" text-anchor="middle" fill="white">word</text>
<rect x="629" y="151" width="84" height="33" rx="16" fill="#8fd400"/><text x="671" y="174" text-anchor="middle">logical</text>
<rect x="914" y="151" width="79" height="33" rx="16" fill="#c8aff0"/><text x="953" y="174" text-anchor="middle">vector</text>
<rect x="64" y="348" width="128" height="36" rx="18" fill="#3cc8e1"/><text x="128" y="373" text-anchor="middle">data frame</text>
</g>
<g font-family="Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#1155cc">
<text x="59" y="223">speed_limit</text><text x="59" y="257">&lt;- 15</text>
<text x="344" y="223">company</text><text x="344" y="257">&lt;- "Lime"</text>
<text x="629" y="223">is_weekend</text><text x="629" y="257">&lt;- TRUE</text>
<text x="914" y="223">trip_counts</text><text x="914" y="257" font-size="21">&lt;- c(8, 12, 9)</text>
<text x="64" y="442" font-size="27">scooterData</text><text x="64" y="479" font-size="27">&lt;-</text>
</g>
<text x="64" y="522" font-family="Avenir, Aptos, Arial, sans-serif" font-size="19" fill="#5c6470">One variable holds</text>
<text x="64" y="548" font-family="Avenir, Aptos, Arial, sans-serif" font-size="19" fill="#5c6470">the entire table.</text>
<!-- dataset table: fully contained and legible -->
<g transform="translate(335,365)">
<rect width="790" height="290" fill="white" stroke="#cfd5dd" stroke-width="2"/>
<rect width="790" height="58" fill="#1460f3"/>
<g stroke="#dce0e6" stroke-width="2">
<path d="M 250 0 V 290 M 450 0 V 290 M 575 0 V 290 M 0 58 H 790 M 0 116 H 790 M 0 174 H 790 M 0 232 H 790"/>
</g>
<g font-family="Avenir, Aptos, Arial, sans-serif" font-weight="700" font-size="18" fill="white">
<text x="15" y="36">provider_name</text><text x="265" y="36">day</text><text x="465" y="36">trips</text><text x="590" y="36" font-size="17">avg_distance</text>
</g>
<g font-family="Avenir, Aptos, Arial, sans-serif" font-size="19" font-weight="600" fill="#283544">
<text x="15" y="95">Lime</text><text x="265" y="95">2024-04-05</text><text x="465" y="95">719</text><text x="590" y="95">136.4</text>
<text x="15" y="153">Bird</text><text x="265" y="153">2024-04-06</text><text x="465" y="153">294</text><text x="590" y="153">1.21</text>
<text x="15" y="211">VeoRide INC.</text><text x="265" y="211">2024-04-07</text><text x="465" y="211">188</text><text x="590" y="211">0.98</text>
<text x="15" y="269">…</text><text x="265" y="269">…</text><text x="465" y="269">…</text><text x="590" y="269">…</text>
</g>
</g>
</svg>
