<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A variable can store different kinds of values, including a whole table</title>
  <desc id="desc">Five cards show R variables holding a number, a word, a logical value, a vector, and a data frame.</desc>
  <defs><style>
      .bg { fill: #fcfcfa; }
      .card { fill: white; stroke: #dce0e6; stroke-width: 3; }
      .code { font: 700 28px Menlo, Consolas, monospace; fill: #1155cc; }
      .tag { font: 700 18px Avenir, Aptos, Arial, sans-serif; }
      .small { font: 500 18px Avenir, Aptos, Arial, sans-serif; fill: #5c6470; }
      .title { font: 700 42px Avenir, Aptos, Arial, sans-serif; fill: #1460f3; }
      .subtitle { font: 500 24px Avenir, Aptos, Arial, sans-serif; fill: #354252; }
      .teal { fill: #3cc8e1; }
      .pink { fill: #cf2f7b; }
      .green { fill: #8fd400; }
      .purple { fill: #c8aff0; }
      .gold { fill: #ffd45a; }
      .tagTextDark { fill: #283544; }
      .tagTextLight { fill: white; }
      .tableHead { fill: #1460f3; }
      .gridline { stroke: #dce0e6; stroke-width: 2; }
      .cellText { font: 600 15px Avenir, Aptos, Arial, sans-serif; fill: #283544; }
    </style></defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="600" y="68" text-anchor="middle" class="title">A variable can hold a whole table too</text>
  <text x="600" y="108" text-anchor="middle" class="subtitle">In R, a data frame is just another object stored in a variable.</text>

  <g transform="translate(70,155)"><rect class="card" rx="28" width="240" height="170"/><rect x="18" y="18" width="88" height="34" rx="17" class="gold"/><text x="62" y="41" text-anchor="middle" class="tag tagTextDark">number</text><text x="24" y="92" class="code">speed_limit</text><text x="24" y="132" class="code">&lt;- 15</text></g>
  <g transform="translate(340,155)"><rect class="card" rx="28" width="240" height="170"/><rect x="18" y="18" width="78" height="34" rx="17" class="pink"/><text x="57" y="41" text-anchor="middle" class="tag tagTextLight">word</text><text x="24" y="92" class="code">company</text><text x="24" y="132" class="code">&lt;- "Lime"</text></g>
  <g transform="translate(610,155)"><rect class="card" rx="28" width="240" height="170"/><rect x="18" y="18" width="88" height="34" rx="17" class="green"/><text x="62" y="41" text-anchor="middle" class="tag tagTextDark">logical</text><text x="24" y="92" class="code">is_weekend</text><text x="24" y="132" class="code">&lt;- TRUE</text></g>
  <g transform="translate(880,155)"><rect class="card" rx="28" width="250" height="170"/><rect x="18" y="18" width="78" height="34" rx="17" class="purple"/><text x="57" y="41" text-anchor="middle" class="tag tagTextDark">vector</text><text x="24" y="92" class="code">trip_counts</text><text x="24" y="132" class="code">&lt;- c(8, 12, 9)</text></g>

  <g transform="translate(155,390)"><rect class="card" rx="28" width="890" height="290"/><rect x="24" y="20" width="108" height="34" rx="17" class="teal"/><text x="78" y="43" text-anchor="middle" class="tag tagTextDark">data frame</text><text x="24" y="92" class="code">scooterData &lt;-</text><text x="24" y="122" class="small">a variable can point to an entire table</text>
    <g transform="translate(330,42)"><rect x="0" y="0" width="520" height="204" fill="white" stroke="#cfd5dd" stroke-width="2.5"/><rect x="0" y="0" width="520" height="40" class="tableHead"/><line x1="160" y1="0" x2="160" y2="204" class="gridline"/><line x1="315" y1="0" x2="315" y2="204" class="gridline"/><line x1="420" y1="0" x2="420" y2="204" class="gridline"/><line x1="0" y1="40" x2="520" y2="40" class="gridline"/><line x1="0" y1="81" x2="520" y2="81" class="gridline"/><line x1="0" y1="122" x2="520" y2="122" class="gridline"/><line x1="0" y1="163" x2="520" y2="163" class="gridline"/><text x="14" y="26" class="tag tagTextLight">provider_name</text><text x="175" y="26" class="tag tagTextLight">day</text><text x="330" y="26" class="tag tagTextLight">trips</text><text x="435" y="26" class="tag tagTextLight">avg_distance</text><text x="14" y="66" class="cellText">Lime</text><text x="175" y="66" class="cellText">2024-04-05</text><text x="350" y="66" class="cellText">719</text><text x="450" y="66" class="cellText">136.4</text><text x="14" y="107" class="cellText">Bird</text><text x="175" y="107" class="cellText">2024-04-06</text><text x="350" y="107" class="cellText">294</text><text x="450" y="107" class="cellText">1.21</text><text x="14" y="148" class="cellText">VeoRide INC.</text><text x="175" y="148" class="cellText">2024-04-07</text><text x="350" y="148" class="cellText">188</text><text x="450" y="148" class="cellText">0.98</text><text x="14" y="189" class="cellText">…</text><text x="175" y="189" class="cellText">…</text><text x="350" y="189" class="cellText">…</text><text x="450" y="189" class="cellText">…</text></g></g>
</svg>