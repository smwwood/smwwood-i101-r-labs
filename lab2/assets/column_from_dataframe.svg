<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450"><rect width="980" height="450" fill="#fcfcfa"/><text x="490" y="48" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#1460f3">One table → one column → a summary</text><g font-family="Arial" font-size="22"><rect x="40" y="95" width="440" height="265" fill="#fff" stroke="#bbc5d1" stroke-width="3"/><rect x="40" y="95" width="440" height="50" fill="#283544"/><text x="61" y="128" fill="white">provider_name</text><text x="306" y="128" fill="white">trips</text><rect x="285" y="145" width="195" height="215" fill="#e2f3fc"/><g fill="#293747"><text x="64" y="194">Lime</text><text x="318" y="194">100</text><text x="64" y="244">Bird</text><text x="318" y="244">160</text><text x="64" y="294">Lime</text><text x="318" y="294">220</text><text x="64" y="341">…</text><text x="318" y="341">…</text></g><path d="M500 226H595" stroke="#1460f3" stroke-width="7"/><path d="M595 226l-22 -14v28z" fill="#1460f3"/><rect x="615" y="135" width="325" height="185" rx="12" fill="#fff" stroke="#1460f3" stroke-width="3"/><text x="778" y="177" text-anchor="middle" font-size="22" fill="#283544" font-weight="700">Select the column</text><text x="778" y="219" text-anchor="middle" font-size="22" font-family="monospace" fill="#1460f3">scooterData$trips</text><text x="778" y="263" text-anchor="middle" font-size="22" font-family="monospace" fill="#1460f3">mean(...)</text></g><text x="490" y="418" text-anchor="middle" font-size="20" font-family="Arial" fill="#4d5868">The $ sign selects one variable (one vector) from the table.</text></svg>